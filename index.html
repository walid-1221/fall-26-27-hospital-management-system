<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMS Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Hospital Management System: Admin</h1>
    <nav>
      <a href="#summary">Summary</a>
      <a href="#doctors">Doctors</a>
      <a href="#nurses">Nurses</a>
      <a href="#patients">Patients</a>
    </nav>
  </header>

  <main>
    <!-- SUMMARY -->
    <section id="summary">
      <h2>Summary</h2>
      <div class="box">Doctors: <span id="doctorCount"></span></div>
      <div class="box">Nurses: <span id="nurseCount"></span></div>
      <div class="box">Patients: <span id="patientCount"></span></div>
    </section>

    <!-- DOCTORS -->
    <section id="doctors">
      <h2>Doctors</h2>
      <form id="doctorForm" onsubmit="return addDoctor()">
        <label for="dName">Name</label>
        <input type="text" id="dName">
        <span class="error" id="dNameErr"></span>

        <label for="dDept">Department</label>
        <select id="dDept">
          <option value="">-- Select --</option>
          <option>Medicine</option>
          <option>Cardiology</option>
          <option>Orthopedics</option>
          <option>Pediatrics</option>
        </select>
        <span class="error" id="dDeptErr"></span>

        <label for="dPhone">Phone</label>
        <input type="tel" id="dPhone">
        <span class="error" id="dPhoneErr"></span>

        <button type="submit">Add Doctor</button>
      </form>
      <table>
        <thead>
          <tr><th>No.</th><th>Name</th><th>Department</th><th>Phone</th><th>Action</th></tr>
        </thead>
        <tbody id="doctorBody"></tbody>
      </table>
    </section>

    <!-- NURSES -->
    <section id="nurses">
      <h2>Nurses</h2>
      <form id="nurseForm" onsubmit="return addNurse()">
        <label for="nName">Name</label>
        <input type="text" id="nName">
        <span class="error" id="nNameErr"></span>

        <label for="nWard">Ward</label>
        <select id="nWard">
          <option value="">-- Select --</option>
          <option>General</option>
          <option>ICU</option>
          <option>Emergency</option>
        </select>
        <span class="error" id="nWardErr"></span>

        <label for="nPhone">Phone</label>
        <input type="tel" id="nPhone">
        <span class="error" id="nPhoneErr"></span>

        <button type="submit">Add Nurse</button>
      </form>
      <table>
        <thead>
          <tr><th>No.</th><th>Name</th><th>Ward</th><th>Phone</th><th>Action</th></tr>
        </thead>
        <tbody id="nurseBody"></tbody>
      </table>
    </section>

    <!-- PATIENTS -->
    <section id="patients">
      <h2>Patients</h2>
      <form id="patientForm" onsubmit="return addPatient()">
        <label for="pName">Name</label>
        <input type="text" id="pName">
        <span class="error" id="pNameErr"></span>

        <label for="pAge">Age</label>
        <input type="number" id="pAge" min="1" max="120">
        <span class="error" id="pAgeErr"></span>

        <p>Gender</p>
        <input type="radio" id="pMale" name="gender" value="Male">
        <label for="pMale">Male</label>
        <input type="radio" id="pFemale" name="gender" value="Female">
        <label for="pFemale">Female</label>
        <span class="error" id="pGenderErr"></span>

        <label for="pPhone">Phone</label>
        <input type="tel" id="pPhone">
        <span class="error" id="pPhoneErr"></span>

        <label for="pProblem">Problem</label>
        <textarea id="pProblem" rows="3"></textarea>

        <button type="submit">Add Patient</button>
      </form>
      <table>
        <thead>
          <tr><th>No.</th><th>Name</th><th>Age</th><th>Gender</th><th>Phone</th><th>Problem</th><th>Action</th></tr>
        </thead>
        <tbody id="patientBody"></tbody>
      </table>
    </section>
  </main>

  <footer>&copy; 2026 Hospital Management System</footer>

  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
