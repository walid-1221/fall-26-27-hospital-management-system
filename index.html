<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMS Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Hospital Management System</h1>
  </header>

  <main>
    <!-- put the gif in the images folder; if it is missing the picture simply hides -->
    <img src="images/patient-management-system.gif" alt="Hospital management illustration"
         class="hero" onerror="this.style.display='none'">

    <form id="loginForm" class="login" onsubmit="return login()">
      <h2>Login</h2>

      <label for="userType">User Type</label>
      <select id="userType">
        <option value="">-- Select --</option>
        <option value="admin">Admin</option>
        <option value="doctor">Doctor</option>
        <option value="nurse">Nurse</option>
        <option value="patient">Patient</option>
      </select>
      <span class="error" id="typeErr"></span>

      <label for="email">Email</label>
      <input type="email" id="email">
      <span class="error" id="emailErr"></span>

      <label for="password">Password</label>
      <input type="password" id="password">
      <span class="error" id="passwordErr"></span>

      <button type="submit">Login</button>
      <span class="error" id="loginErr"></span>

      <p>New doctor, nurse or patient? <a href="register.html">Create an account</a></p>
    </form>
  </main>

  <footer>&copy; 2026 Hospital Management System</footer>

  <script src="js/data.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
